{# Expects `tech`; pass `link=True` to make it a filter link, `count` to show a number, `current` for the active filter. #}
{% if link %}<a class="badge badge--{{ tech.category }}" href="{% url 'portfolio:project_list' %}?tech={{ tech.slug }}" data-filter-link{% if current %} aria-current="page"{% endif %}>{% else %}<span class="badge badge--{{ tech.category }}">{% endif %}{% if tech.icon %}<img class="badge__icon" src="{{ tech.icon.url }}" alt="" width="16" height="16" loading="lazy">{% endif %}{{ tech.name }}{% if count %} <span class="badge__count">{{ count }}</span>{% endif %}{% if link %}</a>{% else %}</span>{% endif %}
