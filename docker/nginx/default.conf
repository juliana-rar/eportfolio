# Production reverse proxy for eportfolio.
# nginx serves static and media files directly (fast)
# and forwards every other request to gunicorn (service "web").
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Allow uploads (screenshots, CV PDF)
    client_max_body_size 25M;

    # Static files gathered by "collectstatic" (volume shared with web)
    location /static/ {
        alias /vol/static/;
        access_log off;
        expires 30d;
    }

    # User uploads (volume shared with web)
    location /media/ {
        alias /vol/media/;
        access_log off;
        expires 30d;
    }

    # Everything else goes to Django through gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
